<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F0FDFA" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="WangSh Frontend"
    />
    <!-- Fonts: Inter (Latin) + Noto Sans SC (CJK) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>WangSh</title>
    <!--
      内容运行时（KaTeX / highlight.js / Mermaid / D3+Markmap）不再写在 HTML 里。
      它们唯一的消费方是 BookReader / MindMapViewer，这两个组件都在懒加载路由内，
      因此统一由 src/lib/contentRuntimeLoader.ts 在首次真正渲染时按需注入，
      首屏静态请求从 7 个脚本（gzip ≈1.37MB）降为 0。
      升级 CDN 版本时必须同步修改该模块的 src 与 SRI。
    -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
