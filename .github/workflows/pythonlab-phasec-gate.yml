name: pythonlab-phasec-gate

on:
  workflow_call:
    inputs:
      api_url:
        required: false
        type: string
      rounds:
        required: false
        type: string
      timeout_seconds:
        required: false
        type: string
    secrets:
      PYTHONLAB_SMOKE_USERNAME:
        required: false
      PYTHONLAB_SMOKE_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      api_url:
        description: Deployed API base URL, example https://example.com
        required: true
      rounds:
        description: soak rounds
        required: true
        default: "20"
      timeout_seconds:
        description: probe timeout seconds
        required: true
        default: "20"

concurrency:
  group: pythonlab-phasec-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phasec-gate:
    name: phasec-visibility-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: validate required secrets
        id: validate
        env:
          CONFIGURED_API_URL: ${{ inputs.api_url || github.event.inputs.api_url || vars.PYTHONLAB_API_URL }}
          PYTHONLAB_SMOKE_USERNAME: ${{ secrets.PYTHONLAB_SMOKE_USERNAME }}
          PYTHONLAB_SMOKE_PASSWORD: ${{ secrets.PYTHONLAB_SMOKE_PASSWORD }}
        run: |
          # 这是可选远端巡检；只有显式提供完整环境配置时才执行。
          if [ -z "${CONFIGURED_API_URL}" ] || [ -z "${PYTHONLAB_SMOKE_USERNAME}" ] || [ -z "${PYTHONLAB_SMOKE_PASSWORD}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            {
              echo "## PythonLab Phase C Visibility Gate"
              echo "- status: skipped"
              echo "- reason: missing remote environment configuration"
              echo "- required_secrets: PYTHONLAB_SMOKE_USERNAME, PYTHONLAB_SMOKE_PASSWORD"
              echo "- required_api_url: workflow input api_url or vars.PYTHONLAB_API_URL"
              echo "- hint: 完整配置远端 API URL 与 smoke secrets 后，本次调用才会执行"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: checkout
        if: ${{ steps.validate.outputs.available == 'true' }}
        uses: actions/checkout@v4

      - name: setup python
        if: ${{ steps.validate.outputs.available == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dependencies
        if: ${{ steps.validate.outputs.available == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 aiohttp==3.14.3

      - name: run phase c warmup probe
        if: ${{ steps.validate.outputs.available == 'true' }}
        env:
          API_URL: ${{ inputs.api_url || github.event.inputs.api_url || vars.PYTHONLAB_API_URL || 'http://localhost:8000' }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || github.event.inputs.timeout_seconds || vars.PYTHONLAB_TIMEOUT_SECONDS || '20' }}
          PYTHONLAB_SMOKE_USERNAME: ${{ secrets.PYTHONLAB_SMOKE_USERNAME }}
          PYTHONLAB_SMOKE_PASSWORD: ${{ secrets.PYTHONLAB_SMOKE_PASSWORD }}
        run: |
          python scripts/prod-smoke/redact_exec.py -- \
            python backend/scripts/smoke_pythonlab_print_visibility_probe.py

      - name: run phase c soak gate
        id: gate
        if: ${{ steps.validate.outputs.available == 'true' }}
        env:
          API_URL: ${{ inputs.api_url || github.event.inputs.api_url || vars.PYTHONLAB_API_URL || 'http://localhost:8000' }}
          ROUNDS: ${{ inputs.rounds || github.event.inputs.rounds || vars.PYTHONLAB_PHASEC_ROUNDS || '20' }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || github.event.inputs.timeout_seconds || vars.PYTHONLAB_TIMEOUT_SECONDS || '20' }}
          PYTHONLAB_SMOKE_USERNAME: ${{ secrets.PYTHONLAB_SMOKE_USERNAME }}
          PYTHONLAB_SMOKE_PASSWORD: ${{ secrets.PYTHONLAB_SMOKE_PASSWORD }}
          LOG_DIR: /tmp/phasec_soak
        run: |
          python scripts/prod-smoke/redact_exec.py -- \
            python backend/scripts/soak_pythonlab_phasec.py

      - name: write summary
        if: ${{ always() }}
        env:
          AVAILABLE: ${{ steps.validate.outputs.available }}
          API_URL: ${{ inputs.api_url || github.event.inputs.api_url || vars.PYTHONLAB_API_URL || 'http://localhost:8000' }}
          ROUNDS: ${{ inputs.rounds || github.event.inputs.rounds || vars.PYTHONLAB_PHASEC_ROUNDS || '20' }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds || github.event.inputs.timeout_seconds || vars.PYTHONLAB_TIMEOUT_SECONDS || '20' }}
        run: |
          {
            echo "## PythonLab Phase C Visibility Gate"
            if [ "${AVAILABLE}" != "true" ]; then
              echo "- status: skipped"
              echo "- reason: 未配置 PYTHONLAB_SMOKE_* secrets 或 vars.PYTHONLAB_API_URL"
              echo "- note: probe/soak 已跳过，本次运行不判定失败"
            else
              echo "- api_url: ${API_URL}"
              echo "- rounds: ${ROUNDS}"
              echo "- timeout_seconds: ${TIMEOUT_SECONDS}"
            fi
            if [ -f /tmp/phasec_soak/summary.json ]; then
              echo ""
              echo '```json'
              cat /tmp/phasec_soak/summary.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
